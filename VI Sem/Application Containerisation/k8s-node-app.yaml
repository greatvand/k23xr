# ----- Deployment -----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: 203851464320.dkr.ecr.us-east-1.amazonaws.com/xebia/nodejs:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
# ----- Service (ClusterIP — ALB talks to this) -----
apiVersion: v1
kind: Service
metadata:
  name: node-app-svc
  namespace: default
spec:
  type: ClusterIP          # NOT LoadBalancer — ALB controller handles external access
  selector:
    app: node-app
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---
# ----- Ingress (ALB) -----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing      # public ALB
    alb.ingress.kubernetes.io/target-type: ip              # routes directly to pod IPs
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-app-svc
                port:
                  number: 80